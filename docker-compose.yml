# PetCare O2O — Docker Compose 单机编排
# 关联文档：docs/07-deployment-guide.md、docs/03-configuration-management-plan.md
# CI：CI-BS-011
#
# 前置：项目根 .env 必须提供 MYSQL_ROOT_PASSWORD / DB_PASSWORD / PGVECTOR_PASSWORD / JWT_SECRET
#       （${VAR:?} 强制语法，缺失即拒绝启动，杜绝弱口令回退 changeme 静默生效）
# 启动：docker compose up -d --build --wait
# 停止：docker compose down
# 重置：docker compose down -v

name: petcare

services:
  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: petcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petcare_o2o}
      # 自动创建应用用户并授予 MYSQL_DATABASE 全部权限（仅卷为空首次初始化时生效）
      MYSQL_USER: ${DB_USERNAME:-petcare}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      # 关键：强制客户端握手用 utf8mb4，避免 latin1 客户端导致中文双重编码
      - --character-set-client-handshake=FALSE
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动初始化 schema（仅卷为空时执行）。
      # H-2 安全修复：dev 种子数据（含弱口令超管 admin/admin123456）不再默认挂载——
      # 本地开发需要种子数据时叠加 override：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # 默认 3317：避开同机其他项目（如 cicd 出差报销系统）对 3307 的占用
      - "127.0.0.1:${MYSQL_PORT:-3317}:3306"
    healthcheck:
      # 无凭据探测存活：mysqladmin ping 只要 server 响应即返回 0，凭据无需也不应写入
      # healthcheck（否则密码经 docker inspect 对所有可访问 docker socket 的账号可见）
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - petcare-net

  # ---------- 向量库（V2 AI Agent，独立 PG 实例）----------
  # CI-DB-017；D-013；docs/09-ai-agent-design.md §4.2
  # PgVector 只存派生知识副本，业务真源仍在 MySQL，两者物理隔离
  postgres:
    image: pgvector/pgvector:pg16
    container_name: petcare-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-petcare_ai}
      POSTGRES_USER: ${PGVECTOR_USER:-petcare}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD is required in .env}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 首次启动自动建扩展 + 知识库表（仅卷为空时执行）
      - ./src/main/resources/schema-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-petcare} -d ${PGVECTOR_DB:-petcare_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - petcare-net

  # ---------- 后端 API ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: petcare-api:${IMAGE_TAG:-1.0.0}
    container_name: petcare-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-petcare_o2o}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-petcare}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env or environment}
      JWT_ISSUER: ${JWT_ISSUER:-petcare-o2o-api}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      AI_PROVIDER_ENABLED: ${AI_PROVIDER_ENABLED:-false}
      # DeepSeek 连接（D-004 修订）：API Key 由 .env 注入，缺失时调用返回 503
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # V2 AI Agent（D-013）：Agent / RAG / PgVector 连接，默认关闭，缺值不影响启动
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-false}
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: 5432
      PGVECTOR_DB: ${PGVECTOR_DB:-petcare_ai}
      PGVECTOR_USER: ${PGVECTOR_USER:-petcare}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD is required in .env}
      TZ: Asia/Shanghai
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8080"
    volumes:
      - api-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/system/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - petcare-net

  # ---------- 管理端（PC Web）----------
  admin-web:
    build:
      context: .
      dockerfile: frontend/admin-web/Dockerfile
    image: petcare-admin-web:${IMAGE_TAG:-1.0.0}
    container_name: petcare-admin-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 仅监听本机回环：容器内无 TLS，公网访问统一经宿主机反向代理终止 TLS（docs/13 §6），
      # 避免管理端口令与 JWT 明文 HTTP 直接暴露公网
      - "127.0.0.1:${ADMIN_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - petcare-net

  # ---------- 用户端 H5 ----------
  h5:
    build:
      context: .
      dockerfile: frontend/miniapp/Dockerfile
    image: petcare-h5:${IMAGE_TAG:-1.0.0}
    container_name: petcare-h5
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 同 admin-web：仅本机回环，对外经 TLS 反向代理（docs/13 §6）
      - "127.0.0.1:${H5_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - petcare-net

volumes:
  mysql-data:
    name: petcare-mysql-data
  postgres-data:
    name: petcare-postgres-data
  api-uploads:
    name: petcare-api-uploads

networks:
  petcare-net:
    name: petcare-net
    driver: bridge
