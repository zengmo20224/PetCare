spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

petcare:
  security:
    jwt-secret: test-secret-key-for-unit-tests-at-least-32-chars
    jwt-issuer: petcare-o2o-api-test
    jwt-expiration-minutes: 120
    # 测试环境放宽限流阈值，避免单 IP 密集登录/注册用例误触发 429。
    # 限流逻辑本身由 RateLimitFilterTest（单元）覆盖，不依赖此处的低阈值。
    rate-limit:
      window-seconds: 60
      max-requests: 10000
  wechat:
    # test 默认 disabled，保留 wechat-login 端点返回 422 的断言；
    # 需要联调建账号链路的用例用 @TestPropertySource(properties="petcare.wechat.mode=mock") 覆盖。
    mode: disabled
  test-login:
    allowed-phones: "13800138001,13800138002,13800138003,13800138010,13800138011,13800138050"
  ai:
    # 测试态强制关闭 V1 Provider 与 V2 Agent（对标 V1 test profile 不开 provider）。
    # V2 Agent 测试通过 MockAiProviderClient / tc-pgvector profile 独立覆盖，见 docs/09 §10。
    provider-enabled: false
    agent-enabled: false
    rag-enabled: false
