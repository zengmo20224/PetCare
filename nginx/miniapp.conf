# 用户端 H5 nginx 配置
# 关联文档：docs/07-deployment-guide.md §5.2、docs/13-vps-deploy-cheatsheet.md
# CI：CI-RC-007

server {
    listen       80;
    server_name  _;

    # 静态资源根目录（uni-app H5 构建产物由 Dockerfile COPY 进来）
    # uni-app build:h5 产物在 dist/build/h5/
    root   /usr/share/nginx/html;
    index  index.html;

    # 上传体积与后端 multipart 对齐（后端 max-request-size=12MB；nginx 默认 1MB 会 413）
    client_max_body_size 12m;

    # 安全响应头（M2 加固 + B5/CSP 补齐）
    # 注意：location 内一旦出现任何 add_header 即不再继承本级别——
    # 各自带 add_header 的 location（静态资源/uploads）必须显式重复全部安全头。
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP（B5）：script-src 暂含 unsafe-inline 以兼容构建产物内联引导，后续可收紧；
    # img-src https: 允许头像/演示图外链（关联 L5 avatarUrl 白名单待办）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存
    # B5：location 内有 add_header 时不继承 server 级头 → 显式重复全部安全头
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        access_log off;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # B1/M4（2026-08-23）：生产拓扑为 Caddy(TLS)→本 nginx→api。Caddy 默认以真实客户端
        # IP 覆盖写 XFF；此处必须透传该单值，禁止用 $proxy_add_x_forwarded_for 追加——
        # 追加会把 Caddy 连接源(127.0.0.1)变成末段，后端限流键退化为网关 IP（全站共享桶）。
        # 前提：仅允许一层可信反代前置；直连暴露 nginx 时攻击者可伪造此头。
        proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 后端上传文件（H5 端展示商品/活动/头像图片）
    # M1 安全加固：禁止 MIME sniff；B5：显式补全继承断点处的安全头
    location /uploads/ {
        proxy_pass         http://api:8080/uploads/;
        proxy_set_header   Host $host;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
