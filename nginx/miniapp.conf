# 用户端 H5 nginx 配置
# 关联文档：docs/07-deployment-guide.md §5.2
# CI：CI-RC-007

server {
    listen       80;
    server_name  _;

    # 静态资源根目录（uni-app H5 构建产物由 Dockerfile COPY 进来）
    # uni-app build:h5 产物在 dist/build/h5/
    root   /usr/share/nginx/html;
    index  index.html;

    # 上传体积与后端 multipart 对齐（后端 max-request-size=12MB；nginx 默认 1MB 会 413）
    client_max_body_size 12m;

    # 安全响应头（M2 安全加固：点击劫持 / MIME 嗅探 / Referrer 泄露）
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        # location 内自带 add_header 时不继承 server 级头，单独补 nosniff（JS 资源防嗅探）
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 后端上传文件（H5 端展示商品/活动/头像图片）
    # M1 安全加固：禁止 MIME sniff，强制按图片类型处理，防止上传内容被当脚本执行
    location /uploads/ {
        proxy_pass         http://api:8080/uploads/;
        proxy_set_header   Host $host;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
